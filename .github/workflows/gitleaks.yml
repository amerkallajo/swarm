# Gitleaks — pinned CLI, deterministic canary, and full-history scan
# Required check name for branch protection: "gitleaks"
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install verified Gitleaks v8.30.1
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          chmod 0755 "${install_dir}/gitleaks"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Verify synthetic canary detection
        run: |
          set -euo pipefail
          canary_dir="${RUNNER_TEMP}/gitleaks-canary"
          mkdir -p "${canary_dir}"
          part_a='SWARM_CANARY_'
          part_b='TOKEN='
          part_c='abcdef1234567890abcdef1234567890abcdef12'
          printf '%s%s%s\n' "${part_a}" "${part_b}" "${part_c}" > "${canary_dir}/test.env"
          set +e
          gitleaks dir --no-banner --config .gitleaks.toml --exit-code 42 --redact "${canary_dir}"
          CANARY_EXIT=$?
          set -e
          rm -rf "${canary_dir}"
          if [ "${CANARY_EXIT}" -ne 42 ]; then
            echo "::error::Gitleaks canary expected exit 42, received ${CANARY_EXIT}"
            exit 1
          fi
          echo "Gitleaks synthetic canary detected as expected"

      - name: Scan complete Git history
        run: gitleaks git --no-banner --config .gitleaks.toml --redact --exit-code 1 .
